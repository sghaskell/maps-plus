#
# Splunk app configuration file
#

[id]
name = leaflet_maps_app
version = 4.6.1

[install]
is_configured = 0

[ui]
is_visible = true
label = Maps+ for Splunk

[launcher]
author = Scott Haskell
description = The mapping equivalent of a Swiss Army knife for Splunk.
version = 4.6.1

# maps-plus:phase03-load-matrix — Plan 03-01 W0 empirical load-point probe
# Records which Splunk Web pages execute appserver/static/parent-auth-bridge.js
# under each candidate load mechanism. Each row records the IIFE's
# console.info('[maps-plus:parent-bridge] loaded') firing as observed in
# Brave/Chrome DevTools Console on splunk-10-dev (Splunk 10.x).
#
# Mechanisms (corrected after first M1 probe — see M1 result note below):
#   M1 = appserver/static/dashboard.js (Splunk 10.x official auto-load on every
#        dashboard within the app's namespace; verified per docs.splunk.com
#        "Customize dashboard styling and behavior", 10.2.2510)
#   M2 = nav XML include (default/data/ui/nav/default.xml) — fallback only if
#        M1 fails P4; structurally constrained to leaflet_maps_app pages
#   M3 = per-dashboard <dashboard script="..."> attribute opt-in
#        (SimpleXML; cross-app reference syntax = "leaflet_maps_app:parent-auth-bridge.js");
#        no DS v2 equivalent — DS v2 dashboards have no script= escape hatch
#
# Per-mechanism single-line matrix entries (T03-01-W0 acceptance gate format):
# maps-plus:phase03-load-matrix=mechanism=dashboard_js;classic=yes;ds_list=no;ds_editor=no;ds_view=no;sample_path=/en-US/splunkd/__raw/services/maps_plus/tile/proxy
# maps-plus:phase03-load-matrix=mechanism=nav_xml;classic=not_tested;ds_list=not_tested;ds_editor=not_tested;ds_view=not_tested;sample_path=/en-US/splunkd/__raw/services/maps_plus/tile/proxy
# maps-plus:phase03-load-matrix=mechanism=per_dashboard_script_attr;classic=yes;ds_list=na;ds_editor=na;ds_view=na;sample_path=/en-US/splunkd/__raw/services/maps_plus/tile/proxy
# maps-plus:phase03-load-matrix=mechanism=none;classic=yes;ds_list=no;ds_editor=no;ds_view=no;sample_path=/en-US/splunkd/__raw/services/maps_plus/tile/proxy
#
# Pages:
#   P1 = Classic SimpleXML dashboard view (e.g. /en-US/app/leaflet_maps_app/png_markers)
#   P2 = DS dashboard listing (e.g. /en-US/app/leaflet_maps_app/dashboards)
#   P3 = DS dashboard editor (DS dashboard opened in edit mode)
#   P4 = DS dashboard view (DS dashboard opened in view mode — THE WINNER GATE)
#
# Observation values: yes | no | n/a (mechanism not applicable to that page type)
#
# maps-plus:phase03-load-matrix-begin
#   M1.P1 = yes  (dashboard.js auto-load fires on Classic SimpleXML in app)
#   M1.P2 = no   (DS dashboard listing — not a dashboard render)
#   M1.P3 = no   (DS editor — auto-load does NOT fire on DS v2 pages)
#   M1.P4 = no   (DS view — auto-load does NOT fire on DS v2 pages)
#   M2.P1 = not-tested  (M2/nav-XML offers no improvement over M1 for DS pages)
#   M2.P2 = not-tested
#   M2.P3 = not-tested
#   M2.P4 = not-tested
#   M3.SimpleXML-in-leaflet_maps_app = yes  (script="parent-auth-bridge.js" works)
#   M3.DS-v2-anywhere = n/a  (DS v2 dashboards have no script= attribute —
#                             no SimpleXML-style per-dashboard opt-in exists)
# maps-plus:phase03-load-matrix-end
#
# maps-plus:phase03-load-winner = M1+M3 (SimpleXML only); DS v2 = escalation
# (Splunk 10.x has no app-scoped, REQ-DS-07-compliant mechanism for loading
# top-frame JS on Dashboard Studio v2 pages. Phase 3 ships the bridge for
# Classic SimpleXML hosts via M1 (dashboard.js auto-load) and M3
# (per-dashboard script= attribute opt-in). For DS v2 hosts the bridge is
# unreachable from the top frame and the iframe-side latch enters
# bridge-absent mode per D-02 / D-NN-6 — exactly one warning, blank tiles,
# no retry storm, no exception into the DS adapter. Per D-01 escalation
# clause: README documents the manual local/web.conf override an admin
# (NOT the app) can apply if they need DS v2 support, recorded as accepted
# risk with a Phase 4 follow-up to track Splunk DS v2 platform evolution.)
#
# M1 first-probe result note (2026-04-18, splunk-10-dev / Splunk 10.x):
#   First probe used appserver/static/application.js as the auto-load file.
#   No fires on P1..P4. Investigation against docs.splunk.com 10.2.2510
#   "Customize dashboard styling and behavior" page revealed the documented
#   per-app auto-load filename is dashboard.js (NOT application.js) — the
#   probe was using the wrong filename. Re-probe is in progress with
#   appserver/static/dashboard.js (results above for M1).
#
# Structural finding logged during re-planning:
#   The DS dashboard created for this matrix lives in the search app's
#   user-private namespace (/opt/splunk/etc/users/admin/search/local/data/ui/
#   views/maps-plus-ds-uat.xml). Any leaflet_maps_app-scoped auto-load
#   mechanism (M1 dashboard.js, M2 nav) is reachable ONLY when the dashboard
#   is itself hosted in the leaflet_maps_app namespace. If users save DS
#   dashboards to other apps (search, ITSI, etc.), M1/M2 will not fire and
#   M3 (the per-dashboard script= attribute) is the only opt-in available
#   for SimpleXML hosts. DS v2 dashboards have no script= escape hatch at
#   all — bridge availability for DS v2 dashboards in non-leaflet_maps_app
#   namespaces is a Phase 3 documented limitation that the README must call
#   out and Phase 4+ may revisit.

[package]
check_for_updates = 1
id = leaflet_maps_app