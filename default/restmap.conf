# Maps+ Dashboard Studio raster tile proxy.
# Registered endpoint: /services/maps_plus/tile/proxy
# Handler source: bin/tile_proxy.py (class TileProxyHandler)
#
# Splunk 9.x REST syntax: [script:<uniqueName>] with scripttype=python so the
# handler inherits splunk.rest.BaseRestHandler and writes raw PNG bytes via
# self.response.write(). The persist framework was tried in UAT-1..UAT-3 and
# rejected: it JSON-serializes handle()'s return dict, corrupting binary
# payloads on the HTTP wire. See 01-01-SUMMARY.md Gap-Closure (UAT-4).
#
# Script path: flat filename under bin/ — scripttype=python invokes
# $SPLUNK_HOME/bin/runScript.py which chdir()s into the script's directory.
# A nested "rest/maps_plus/tile_proxy.py" path failed with FileNotFoundError
# at os.chdir (UAT-5). See Gap-Closure (UAT-5).

[script:maps_plus_tile_proxy]
match                 = /maps_plus/tile/proxy
scripttype            = python
script                = tile_proxy.py
handler               = tile_proxy.TileProxyHandler
python.version        = python3
requireAuthentication = true
