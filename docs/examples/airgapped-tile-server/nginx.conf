# nginx configuration for airgapped Maps+ tile server.
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.yml.

proxy_cache_path /var/cache/nginx/tiles
                 levels=1:2
                 keys_zone=tiles:50m
                 max_size=20g
                 inactive=30d
                 use_temp_path=off;

# HTTP — for initial bring-up. Production should redirect this to HTTPS.
server {
    listen 80;
    server_name _;

    # CORS: Splunk Web embeds the visualization in an iframe, so tile
    # requests are cross-origin from the browser's perspective. We set the
    # Access-Control-Allow-Origin header per-location below. (nginx's
    # add_header does NOT inherit across nested scopes — any add_header in
    # an inner block REPLACES outer ones, so we cannot DRY this up.)
    #
    # IMPORTANT: tileserver-gl sets ACAO: * upstream. Without
    # proxy_hide_header in the proxy location, the browser sees TWO
    # ACAO headers and rejects the response per the CORS spec.

    # Static MapLibre assets served directly from disk. We avoid /styles/ as a
    # prefix because tileserver-gl owns /styles/{name}/{z}/{x}/{y}.png for
    # server-side raster rendering; instead we match /styles/*.json explicitly.
    #
    # Order: prefix-with-^~ wins over regex without ^~, but two ^~ prefixes
    # resolve by longest match. fonts/sprites/natural_earth are unambiguous.
    location ^~ /fonts/ {
        root /srv/tiles;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location ^~ /sprites/ {
        root /srv/tiles;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location ^~ /natural_earth/ {
        root /srv/tiles;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    # Style JSON files only — regex match so tileserver-gl keeps owning
    # /styles/{name}/{z}/{x}/{y}.png raster rendering.
    location ~ ^/styles/[^/]+\.json$ {
        root /srv/tiles;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Everything else (vector tiles, raster /styles/{name}/{z}/{x}/{y}.png,
    # TileJSON, web GUI) goes to tileserver-gl.
    location / {
        proxy_pass http://tileserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip upstream CORS headers so our own add_header below is the
        # ONLY ACAO the browser sees. Without this, browsers reject the
        # response because the spec forbids duplicate ACAO headers.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}

# HTTPS — uncomment after providing ./tls/server.crt and ./tls/server.key.
# Splunk Web served over HTTPS will block mixed-content tile requests, so
# production deployments MUST serve tiles over HTTPS.
