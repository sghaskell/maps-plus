# Maps+ Dashboard Studio raster tile proxy.
# Registered endpoint: /services/maps_plus/tile/proxy
# Handler source: bin/rest/maps_plus/tile_proxy.py (class TileProxyHandler)
#
# Splunk 9.x REST syntax: [script:<uniqueName>] with persist scripttype.
# NOT [route:...] — that stanza type is for /services/rest/* framework
# routes, not Python handlers. See Pitfall 1 in RESEARCH.md.

[script:maps_plus_tile_proxy]
match                 = /maps_plus/tile/proxy
scripttype            = persist
script                = rest/maps_plus/tile_proxy.py
handler               = tile_proxy.TileProxyHandler
handleractions        = get
python.version        = python3
requireAuthentication = true
