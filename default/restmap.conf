# Maps+ Dashboard Studio raster tile proxy.
# Registered endpoint: /services/maps_plus/tile/proxy
# Handler source: bin/tile_proxy.py (class TileProxyHandler extends
# splunk.rest.BaseRestHandler)
#
# Do NOT set `script = ...`. Per restmap.conf.spec, the `script` key is for
# handlers that are NOT derived from BaseRestHandler — setting it forces
# Splunk into the legacy runScript.py codepath, which chdir()s to
# os.path.dirname(script) and fails with FileNotFoundError when the value is
# a bare filename (UAT-5b). For BaseRestHandler subclasses, the `handler`
# key alone is sufficient; Splunk resolves MODULE.CLASS from the app's bin/.

[script:maps_plus_tile_proxy]
match                 = /maps_plus/tile/proxy
scripttype            = python
handler               = tile_proxy.TileProxyHandler
python.version        = python3
requireAuthentication = true
