# Search macros shipped with Maps+.

# Adds the basemap tile URL saved on the Maps+ Setup page to the results as a
# mapTileOverride column. Maps+ uses that column when the panel has no
# Map Tile Override of its own. This is how Dashboard Studio maps pick up the
# saved URL (Studio panels cannot read saved settings). Usage, at the end of a
# map panel's search:   ... | `mapsplus_basemap`
# The Setup page rewrites this definition; the default is an empty column.
[mapsplus_basemap]
definition = eval mapTileOverride=""
iseval = 0
