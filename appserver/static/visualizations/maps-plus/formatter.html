<form class="splunk-formatter-section" section-label="Map">

                              <option value="https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png">CartoDB Light</option> 
                              <option value="https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png">CartoDB Dark</option> 
                              <option value="https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png">OpenTopoMap</option> 
                              <option value="https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png">Humanitarian OSM</option>

        </splunk-control-group>
        <splunk-control-group label="Map Attribution Override" help="Use your own attribution.">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.mapAttributionOverride"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Renderer" help="Use Canvas renderer for performance boost drawing vector layers (path, circle). Requires modern browser with Canvas support.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.renderer" value="svg">
                                <option value="canvas">Canvas</option>
                                <option value="svg">SVG</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Progress Indicator" help="Display progress spinner for long running searches">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.showProgress" value="1">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Scroll Wheel Zoom" help="Enable or disable zooming on map with scroll wheel">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.scrollWheelZoom" value="1">

                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Full Screen Mode" help="Enable or disable full screen mode. Map takes up all available space in browser and adjust to resize.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.fullScreen" value="0">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Drilldown" help="Enable or disable drilldown behavior for markers">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.drilldown" value="0">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Drilldown Mouse Event" help="Select mouse event that triggers drilldown from markers">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.drilldownAction" value="dblclick">

                                <option value="click">Click</option>

        </splunk-control-group>
        <splunk-control-group label="Context Menu" help="Enable or disable context menu when right clicking the map.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.contextMenu" value="1">

                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Default Height" help="Initial Height Of Map (Default: 600)">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.defaultHeight" value="600"></splunk-text-input>
        </splunk-control-group>
    </form>
    <form class="splunk-formatter-section" section-label="Map Settings">
        <splunk-control-group label="Auto Fit & Zoom" help="Dynamically set map view that contains all markers with the maximum zoom level possible when search finishes.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.autoFitAndZoom" value="1">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Auto Fit & Zoom Delay (ms)" help="Delay in milliseconds before triggering Auto Fit & Zoom. Increase if you get inconsistent behavior (Default: 500).">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.autoFitAndZoomDelay" value="500"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Map Zoom" help="Initial Zoom for map (Default: 6).">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.mapCenterZoom" value="6"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Center Lat" help="Initial Center Latitiude (Default: 39.50)">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.mapCenterLat" value="39.50"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Center Lon" help="Initial Center Longitude (Default: -98.35)">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.mapCenterLon" value="-98.35"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Min Zoom" help="Minimum zoom for tile layer. Does not affect map zoom. (Default: 1)">
            <splunk-text-input class="input-medium" name="{{VIZ_NAMESPACE}}.minZoom" value="1"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Max Zoom" help="Maximum zoom for tile layer. Does not affect map zoom. (Default: 19)">
            <splunk-text-input class="input-medium" name="{{VIZ_NAMESPACE}}.maxZoom" value="19"></splunk-text-input>
        </splunk-control-group>
    </form>
    <form class="splunk-formatter-section" section-label="Clustering">
        <splunk-control-group label="Enable Clustering" help="Disable clustering and plot all markers. WARNING - This comes at a significant performance penalty for large datasets.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.cluster" value="1">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Show All Popups" help="Display all popups on page load. Only works with clustering disabled.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.allPopups" value="0">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Allow Multiple Popups" help="Allow multiple popups to dispaly on screen without closing previous. Will disappear at higher zoom levels with clustering enabled. Enabled by default when showing all popups.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.multiplePopups" value="0">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Animate" help="Animate cluster separation on zoom">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.animate" value="1">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Single Marker Mode" help="Re-style single marker icon to marker cluster style (round)">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.singleMarkerMode" value="0">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
    </form>
    <form class="splunk-formatter-section" section-label="Clustering Settings">
        <splunk-control-group label="Disable Clustering At Zoom" help="If enabled, disable clustering at and below level specified in Disable Clustering At Zoom Level.">
            <splunk-radio-input name="{{VIZ_NAMESPACE}}.disableClusteringAtZoom" value="0">
                                <option value="1">Enabled</option>
                                <option value="0">Disabled</option>
                            </splunk-radio-input>
        </splunk-control-group>
        <splunk-control-group label="Disable Clustering At Zoom Level" help="At this zoom level and below, markers will not be clustered. Must set Disable Clustering At Zoom to Enabled.">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.disableClusteringAtZoomLevel"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Max Cluster Radius" help="A cluster will cover at most this many pixels from its center (Default: 80)">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.maxClusterRadius" value="80"></splunk-text-input>
        </splunk-control-group>
        <splunk-control-group label="Cluster Warning Size" help="Display an alert warning that the cluster exceeds threshold at max-zoom and do not show underlying markers. Browser may hang and die if a single point exceeds a very large number.(Default: 100)">

        </splunk-control-group>
        <splunk-control-group label="Distance Multiplier" help="Increase to increase the distance away that markers appear from the center when expanded at max zoom. (Default: 1)">
            <splunk-text-input name="{{VIZ_NAMESPACE}}.spiderfyDistanceMultiplier" value="1"></splunk-text-input>
        </splunk-control-group>
    </form>
    <form class="splunk-formatter-section" section-label="Markers">
        <splunk-control-group label="Permanent Tooltip" help="Open the tooltip permanently or only on mouseover. Depends on tooltip field in search results.">

                                <option value="0">Disabled</option>

                                <option value="0">Disabled</option>
