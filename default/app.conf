#
# Splunk app configuration file
#

[id]
name = leaflet_maps_app
version = 4.6.9

[install]
# Setup is optional (Manage Apps > Maps+ > Set up), so do not force-redirect first launch.
is_configured = 1

[ui]
is_visible = true
label = Maps+ for Splunk
setup_view = maps_plus_setup

[launcher]
author = Scott Haskell
description = The mapping equivalent of a Swiss Army knife for Splunk.
version = 4.6.9

[package]
check_for_updates = 1
id = leaflet_maps_app

[triggers]
reload.maps_plus_settings = simple
